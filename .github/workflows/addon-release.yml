name: Build Peripheral addon

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build CurseForge review ZIP
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).addonVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid addon version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match the addon version.' }
            if (!(Test-Path -LiteralPath "release/CHANGELOG-v$version.md" -PathType Leaf)) { throw 'Missing release changelog.' }
          }
          $tocVersionPattern = '^## Version: ' + [regex]::Escape($version) + '$'
          if (!(Select-String -LiteralPath 'addon/ForeverWorkspace/ForeverWorkspace.toc' -Pattern $tocVersionPattern)) {
            throw 'TOC version must match package.json.'
          }
          & ./scripts/package.ps1 -CurseForgeReview
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=dist/Peripheral-$version-curseforge-review.zip" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Peripheral-CurseForge
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
      - name: Submit tagged beta to CurseForge
        if: github.event_name == 'push' && vars.CURSEFORGE_UPLOAD_ENABLED == 'true'
        shell: pwsh
        env:
          CF_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_GAME_VERSION_ID: ${{ vars.CURSEFORGE_GAME_VERSION_ID }}
          CF_UPLOAD_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          ADDON_VERSION: ${{ steps.package.outputs.version }}
          ADDON_ZIP: ${{ steps.package.outputs.zip }}
        run: |
          if ($env:CF_PROJECT_ID -notmatch '^[1-9]\d*$' -or $env:CF_GAME_VERSION_ID -notmatch '^[1-9]\d*$' -or !$env:CF_UPLOAD_TOKEN) {
            throw 'Set the CurseForge project ID, Retail version ID and upload token before enabling uploads.'
          }
          $changelog = Get-Content -LiteralPath "release/CHANGELOG-v$env:ADDON_VERSION.md" -Raw
          if ([string]::IsNullOrWhiteSpace($changelog)) { throw 'The release changelog is empty.' }
          $metadata = @{
            changelog = $changelog
            changelogType = 'markdown'
            displayName = "Peripheral $env:ADDON_VERSION"
            gameVersions = @([int]$env:CF_GAME_VERSION_ID)
            releaseType = 'beta'
            isMarkedForManualRelease = $true
          } | ConvertTo-Json -Compress
          $form = @{ metadata = $metadata; file = Get-Item -LiteralPath $env:ADDON_ZIP }
          $result = Invoke-RestMethod -Method Post -MaximumRedirection 0 `
            -Uri "https://www.curseforge.com/api/projects/$env:CF_PROJECT_ID/upload-file" `
            -Headers @{ 'X-Api-Token' = $env:CF_UPLOAD_TOKEN } -Form $form
          if (!$result.id) { throw 'CurseForge did not return a file ID.' }
          Write-Output "CurseForge file ID: $($result.id)"
